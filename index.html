<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.json"><title>DeptDB Mobile</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#101827;color:#eef3fb}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:12px;background:#e8b04a;color:#111827;font-weight:bold}input,textarea,select{width:100%;padding:12px;border:1px solid #35445b;border-radius:12px;background:#182438;color:#fff;margin:5px 0}header{padding:16px;background:#182438;position:sticky;top:0;z-index:2;box-shadow:0 2px 10px #0005}header h1{font-size:18px;margin:0 0 5px}header small{color:#9eb0c9}.wrap{padding:14px;max-width:900px;margin:auto}.panel{background:#182438;padding:16px;border:1px solid #293a54;border-radius:16px;margin:12px 0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.module{background:#22334c;border-radius:16px;padding:16px;text-align:right;min-height:90px;color:white}.module b{display:block;font-size:17px;margin-bottom:8px}.muted{color:#a8b8cc}.hidden{display:none}.item{padding:12px;border:1px solid #30415a;border-radius:12px;margin:8px 0}.item button{padding:9px}.label{display:block;margin-top:12px;font-size:14px;color:#a8b8cc}.top-actions{display:flex;gap:8px;margin-top:10px}.top-actions button{flex:1}.danger{background:#b84444;color:white}.secondary{background:#33465f;color:white}@media(min-width:700px){.wrap{padding:24px}}
</style></head><body><header><h1 id="brand">قاعدة بيانات قسم إدارة الأعمال</h1><small id="sub">نسخة الهاتف</small><div class="top-actions"><button class="secondary" id="homeBtn" onclick="home()">الرئيسية</button><button class="secondary hidden" id="outBtn" onclick="logout()">خروج</button></div></header><main class="wrap"><section id="login" class="panel"><h2>تسجيل الدخول</h2><label class="label">عنوان الخادم (مثال http://192.168.1.5:4455)</label><input id="server" placeholder="http://عنوان-الكمبيوتر:4455" dir="ltr"><label class="label">اسم المستخدم</label><input id="username" autocomplete="username"><label class="label">كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button style="width:100%;margin-top:12px" onclick="login()">دخول</button><p id="err" class="muted"></p><p class="muted">يجب أن يكون الكمبيوتر الذي يشغّل قاعدة البيانات والهاتف على الشبكة نفسها، وأن يكون الخادم يعمل.</p></section><section id="app" class="hidden"><div id="modules" class="cards"></div><div id="content"></div></section></main><script>
let BASE='',TOKEN='',ME=null,CUR=null,RECS=[];const $=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getBase(){return ($('#server').value||'').trim().replace(/\/$/,'')}
async function request(path,opts={}){let r=await fetch(BASE+'/api/'+path,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}});let j;try{j=await r.json()}catch{j={}}if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
async function login(){BASE=getBase();if(!BASE)return $('#err').textContent='أدخل عنوان الخادم';try{let r=await fetch(BASE+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});let j=await r.json();if(!r.ok)throw Error(j.error||'تعذر الدخول');TOKEN=j.token;ME=await request('me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#outBtn').classList.remove('hidden');$('#brand').textContent=ME.settings.title||'قاعدة بيانات القسم';$('#sub').textContent=ME.settings.sub||'نسخة الهاتف';drawModules()}catch(e){$('#err').textContent=e.message}}
function drawModules(){let ms=ME.modules||[];$('#modules').innerHTML=ms.map(m=>`<button class="module" onclick="openMod('${m.id}')"><b>${esc(m.icon)} ${esc(m.name)}</b><small>فتح القسم</small></button>`).join('');$('#content').innerHTML='<div class="panel muted">اختر أحد الأقسام أعلاه لعرض السجلات وإدارتها.</div>'}
async function openMod(id){CUR=ME.modules.find(x=>x.id===id);try{RECS=await request('records?m='+encodeURIComponent(id));drawRecords()}catch(e){$('#content').innerHTML=`<div class="panel">${esc(e.message)}</div>`}}
function drawRecords(){let fs=CUR.fields||[];$('#content').innerHTML=`<div class="panel"><div class="row"><h2>${esc(CUR.icon)} ${esc(CUR.name)}</h2><button onclick="addRecord()">+ إضافة</button></div><input id="search" placeholder="بحث..." oninput="filterRecords()"></div><div id="list"></div>`;filterRecords()}
function filterRecords(){let q=($('#search')?.value||'').toLowerCase();let rs=RECS.filter(r=>Object.values(r.d||{}).some(v=>String(v).toLowerCase().includes(q)));$('#list').innerHTML=rs.map(r=>`<div class="item"><div>${(CUR.fields||[]).map(f=>`<p><b>${esc(f.label)}:</b> ${esc(r.d[f.id])}</p>`).join('')}<p class="muted">${r.files?.length||0} مرفقات</p></div><div class="row"><button class="secondary" onclick="editRecord('${r.id}')">تعديل</button><button class="danger" onclick="delRecord('${r.id}')">حذف</button></div></div>`).join('')||'<div class="panel muted">لا توجد سجلات</div>'}
function formRecord(rec){let fs=CUR.fields||[];let d=rec?.d||{};let html=`<div class="panel"><h2>${rec?'تعديل سجل':'إضافة سجل'}</h2><form id="recordForm">`;for(let f of fs){let val=d[f.id]??'';html+=`<label class="label">${esc(f.label)}</label>`;if(f.type==='textarea')html+=`<textarea name="${f.id}">${esc(val)}</textarea>`;else if(f.type==='select')html+=`<select name="${f.id}"><option value="">--</option>${(f.options||[]).map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else html+=`<input name="${f.id}" type="${['date','number'].includes(f.type)?f.type:'text'}" value="${esc(val)}">`}html+=`<div class="row" style="margin-top:14px"><button type="button" onclick="saveRecord('${rec?.id||''}')">حفظ</button><button type="button" class="secondary" onclick="drawRecords()">إلغاء</button></div></form></div>`;$('#content').innerHTML=html}
function addRecord(){formRecord(null)}function editRecord(id){let r=RECS.find(x=>x.id===id);formRecord(r)}async function saveRecord(id){let d={};for(let f of CUR.fields){let el=document.querySelector(`[name="${CSS.escape(f.id)}"]`);d[f.id]=el?.value||''}try{await request('record?m='+encodeURIComponent(CUR.id),{method:'POST',body:JSON.stringify({m:CUR.id,id:id||undefined,d})});RECS=await request('records?m='+encodeURIComponent(CUR.id));drawRecords()}catch(e){alert(e.message)}}async function delRecord(id){if(!confirm('هل تريد حذف السجل؟'))return;try{await request('record?m='+encodeURIComponent(CUR.id)+'&id='+encodeURIComponent(id),{method:'DELETE'});RECS=await request('records?m='+encodeURIComponent(CUR.id));drawRecords()}catch(e){alert(e.message)}}function home(){if(TOKEN)drawModules()}async function logout(){try{await request('logout',{method:'POST',body:'{}'})}catch{}TOKEN='';ME=null;$('#login').classList.remove('hidden');$('#app').classList.add('hidden');$('#outBtn').classList.add('hidden')}
</script></body></html>
